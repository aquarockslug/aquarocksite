<!doctype html>
<head>
  <title>Title</title>
  <meta charset="utf-8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="stylesheet" href="css/tiny-brutalism.css" />
  <link rel="stylesheet" href="css/modern-normalize.min.css" />
  <style>
    body {
	    background-color: blue
    }
    #ui {
      position: absolute;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #menu {
      position: relative;
      width: 300px;
      right: 125px;
      background-color: white;
      color: black
    }
    #shop {
	    position: absolute;
	    top: 25px;
	    right: 15px;
	    width: 230px
    }
    .box {
	    color: white;
	    border-color: white
    }
  </style>
</head>
<body>
  <div id="ui">
    <div id="menu" class="box">
      <h1>Mine Clicker</h1>
      <p>Dig for treasure! Find gold to upgrade your tools!</p>
      <button onclick="gameStart(); sfx.buttonPress.play(); menu.hidden = true; started = true;">Start</button>
    </div>
    <div id="shop">
      <h2 class="box">Gold - <span id="goldDisplay">0</span>g</h2>
      <div class="box">
	      <h3><span id="drillDisplay">Drill</span>, <span id="drillPriceDisplay">10</span>g</h3>
        <p>Drill by holding down the mouse button</p>
	<button onclick="sfx.buttonPress.play(); upgradeDrill(drillPrice)" >Buy</button>
      </div>
      <div class="box">
	      <h3><span id="bombDisplay">Dynamite</span>, <span id="bombPriceDisplay">10</span>g</h3>
        <p>Automatically Detonate Dynamite all over the field</p>
	<button onclick="sfx.buttonPress.play(); upgradeBomb()" >Buy</button>
      </div>
    </div>
  </div>
  <script src="lib/littlejs.js"></script>
  <script>
    started = false
    playerGold = 0;
    goldDisplay = document.getElementById("goldDisplay")
    drillLevel = 0
    drillDisplay = document.getElementById("drillDisplay")
    drillPriceDisplay.textContext = drillLevel
    drillPrice = 10
    drillPriceDisplay = document.getElementById("drillPriceDisplay")
    drillPriceDisplay.textContext = drillPrice
    bombLevel = 0
    bombPriceDisplay = document.getElementById("bombDisplay")
    bombPriceDisplay.textContext = drillLevel
    bombPrice = 10
    bombPriceDisplay = document.getElementById("bombPriceDisplay")
    bombPriceDisplay.textContext = bombPrice

    settings = {
      screenResolution: vec2(948, 533),
      cameraScale: 5,
      cameraOffset: vec2(25.0, -0.5),
      grassDepth: 2,
      dirtDepth: 15,
      minGoldDepth: 25,
      stoneDepth: 50,
      maxDrillLevel: 3,
      maxBombLevel: 3
    };
    settings.columnCount = Math.round(settings.screenResolution.x / 5 * 0.7)
    settings.rowCount = Math.round(settings.screenResolution.y / 5 * 0.9)
    setCanvasFixedSize(settings.screenResolution);

    colors = {
      bg: new Color(0.1, 0.1, 0.5, 1),
      grass: new Color(25 / 255, 125 / 255, 25 / 255, 1),
      dirt: new Color(116 / 255, 102 / 255, 59 / 255, 1),
      stone: new Color(0.25, 0.25, 0.25, 1),
      bedrock: new Color(0.15, 0.15, 0.15, 1),
      gold: new Color(1.0, 1.0, 0.0, 1),
    };

    const sfx = {
      buttonPress: new Sound([
        0.5,
        ,
        635,
        0.01,
        0.04,
        0.02,
        3,
        4.3,
        ,
        ,
        ,
        ,
        0.05,
        ,
        ,
        ,
        ,
        0.61,
        0.01,
        ,
        -1312,
      ]),
      victory: new Sound([
        0.2,
        ,
        531,
        0.08,
        0.29,
        0.36,
        ,
        0.2,
        ,
        ,
        472,
        0.06,
        0.09,
        ,
        ,
        ,
        ,
        0.8,
        0.16,
        ,
        846,
      ]),
      bomb: new Sound([2.3,,36,.02,.04,.73,1,2.3,5,,,,,1.5,45,1,.13,.46,.14,,728]), // Explosion 36
      shovel: new Sound([1.1,,217,.01,.08,.06,4,3.1,,,,,.07,1,,.3,,.53,.09,.49]), // Hit 37
      gold: new Sound([2,,517,.02,.03,.09,1,3.5,1,,,,.01,,,,.1,.95,,,-1428]) // Pickup 74
    };
  </script>
  <script src="game.js"></script>
  <script>
    engineInit(
      gameInit,
      gameUpdate,
      gameUpdatePost,
      gameRender,
      gameRenderPost,
    );
  </script>
</body>
